name: Release Linux binary bundles

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_VERSION: "24.15.0"

jobs:
  build:
    name: Build linux-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble binary bundle
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-linux-bundle.sh "${TARGET_ARCH}" "${NODE_VERSION}"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ablog-linux-${{ matrix.arch }}
          path: |
            dist/ablog-linux-${{ matrix.arch }}.tar.gz
            dist/ablog-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download binary bundles
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" dist/* \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG_NAME}" dist/* \
              --generate-notes \
              --title "${TAG_NAME}" \
              --repo "${GITHUB_REPOSITORY}"
          fi
